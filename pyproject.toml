[project]
name = "fucktimesheet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmad Sulha Ali Hashim", email = "ahmadsulhaICS@tnb.com.my" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "python-docx>=1.2.0",
    "xlrd>=2.0.2",
]

[project.scripts]
fucktimesheet = "fucktimesheet.process_timesheet:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
